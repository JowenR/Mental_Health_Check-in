{% extends "layouts/auth_base.html" %}
{% block title %}Email Sent{% endblock %}
{% block auth_content %}
<h2 class="mb-6 text-center text-3xl font-semibold text-ink">Check your email</h2>
<p class="mt-3 text-center font-form text-sm text-ink">
  If an account exists for that email, we've sent a reset link. Check your Spam folder too.
</p>
<div class="mt-4 text-center">
  <a href="{% url 'login' %}" class="border-b border-ink font-form text-xs text-ink hover:opacity-70">Back to Log In</a>
</div>
{% endblock %}

{% extends "layouts/auth_base.html" %}
{% block title %}Password Changed{% endblock %}
{% block auth_content %}
<h2 class="mb-6 text-3xl font-semibold text-ink">Password changed</h2>
<p class="mt-3 font-form text-sm text-ink">You can now log in with your new password.</p>
<div class="mt-8 text-center">
  <a href="{% url 'login' %}" class="border-b border-ink font-form text-xs text-ink hover:opacity-70">Log In</a>
</div>
{% endblock %}

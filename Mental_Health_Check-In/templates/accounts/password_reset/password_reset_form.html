{% extends "layouts/auth_base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<h2 class="mb-6 text-3xl font-semibold text-ink">Forgot password?</h2>
<p class="mt-3 font-form text-sm text-ink">Enter your email and we'll send you a reset link.</p>

{% if form.errors %}
<div class="mt-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 font-form text-sm text-red-700">
  Please enter a valid email address.
</div>
{% endif %}

<form method="post" class="mt-6 space-y-6">
  {% csrf_token %}
  <input type="email" name="email" placeholder="Email" required autofocus
    class="h-14 w-full rounded-xl border border-ink px-4 font-form text-sm text-ink placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-navy">
  <button type="submit"
    class="h-10 w-full rounded-lg bg-navy font-form text-sm text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-navy focus:ring-offset-2">
    Send reset link
  </button>
</form>

<div class="mt-4 text-center">
  <a href="{% url 'login' %}" class="border-b border-ink font-form text-xs text-ink hover:opacity-70">Back to Log In</a>
</div>
{% endblock %}

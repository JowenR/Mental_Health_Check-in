{% extends "auth_base.html" %}

{% block title %}Log In{% endblock %}

{% block auth_content %}
<h2 class="font-serif text-3xl font-bold text-ink">Welcome Back</h2>
<p class="mt-3 font-form text-sm text-ink">Log in to your account</p>

{% if form.errors %}
  <div class="mt-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 font-form text-sm text-red-700">
    Invalid email / student ID or password.
  </div>
{% endif %}

<form method="post" class="mt-6 space-y-6">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">

  <input
    type="text"
    name="username"
    placeholder="Email or Student ID"
    required
    autofocus
    class="h-14 w-full rounded-xl border border-ink px-4 font-form text-sm text-ink placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-navy">

  <input
    type="password"
    name="password"
    placeholder="Password"
    required
    class="h-14 w-full rounded-xl border border-ink px-4 font-form text-sm text-ink placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-navy">

  <button
    type="submit"
    class="h-10 w-full rounded-lg bg-navy font-form text-sm text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-navy focus:ring-offset-2">
    Log In
  </button>
</form>

<div class="mt-8 text-center">
  <a href="#" class="border-b border-ink font-form text-xs text-ink hover:opacity-70">
    Forgot Password?
  </a>
</div>

<div class="mt-20 text-center">
  <p class="font-form text-sm font-bold text-ink">Don't have an account?</p>
  <a href="#" class="mt-3 inline-block border-b border-ink font-form text-sm text-ink hover:opacity-70">
    Sign Up
  </a>
</div>
{% endblock %}

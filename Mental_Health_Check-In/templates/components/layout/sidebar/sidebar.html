{% load static %}
{% with current=request.resolver_match.url_name %}
{% static 'images/mind.png' as mind %}
<div style="--mind: url({{ mind }})"
    class="pointer-events-none fixed inset-y-0 left-[280px] right-0 z-10 bg-[#9797cd]
        [mask-image:var(--mind),var(--mind)]
        [mask-repeat:no-repeat]
        [mask-size:55%_auto,42%_auto]
        [mask-position:right_-10%_top_-8%,left_-3%_bottom_-18%]">
</div>
<aside class="sticky top-0 flex h-screen w-[280px] shrink-0 flex-col bg-sidebar" style="display:flex;flex-direction:column;height:100vh">

  <div class="flex items-center gap-5 rounded-br-2xl bg-navy p-6 text-white">
    <img src="{% static 'images/logo.png' %}" alt="Logo"
        class="size-16 rounded-full bg-white object-cover">
    <span class="text-center font-serif text-lg leading-normal font-bold">
      Serenify
    </span>
  </div>
  <nav class="flex flex-col gap-1.5 px-3.5 py-6">
    <a href="{% url 'student_home' %}"
      class="flex items-center gap-4 rounded-lg px-4 py-3.5 text-xl transition hover:bg-navy/10 {% if current == 'student_home' %}bg-active{% endif %}">
      <img src="{% static 'icons/sidebar/home.svg' %}" alt="" class="h-7 w-7 shrink-0"><span>Home</span>
    </a>

    <a href="{% url 'check_in' %}"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'check_in' %}bg-active{% endif %}">
      <img src="{% static 'icons/sidebar/check_in.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Check In</span>
    </a>

    <a href="{% url 'appointments' %}"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'appointments' %}bg-active{% endif %}">
      <img src="{% static 'icons/sidebar/appointment.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Appointments</span>
    </a>

    <a href="{% url 'resources' %}"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'resources' %}bg-active{% endif %}">
      <img src="{% static 'icons/sidebar/resources.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Resources</span>
    </a>

    <a href="{% url 'profile' %}"
      class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if '/profile' in request.path %} bg-active{% endif %}">
      <img src="{% static 'icons/sidebar/profile.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Profile</span>
    </a>
  </nav>

  <div class="px-3.5 pb-7" style="margin-top:auto">
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit"
        class="flex w-full items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10">
        <img src="{% static 'icons/logoutbutton.svg' %}" alt="" class="w-7 h-7">
        <span>Log Out</span>
      </button>
      
    </form>
  </div>

</aside>
{% endwith %}

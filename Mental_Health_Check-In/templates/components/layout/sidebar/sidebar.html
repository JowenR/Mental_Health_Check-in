{% load static %}
{% with current=request.resolver_match.url_name %}
<aside class="sticky top-0 flex h-screen w-[246px] shrink-0 flex-col bg-sidebar" style="display:flex;flex-direction:column;height:100vh">

  <!-- Brand header -->
  <div class="flex items-center gap-5 rounded-br-2xl bg-navy p-5 text-white">
    <img src="{% static 'images/logo.png' %}" alt="Logo"
         class="size-14 rounded-full bg-white object-cover">
    <span class="text-center font-serif text-base leading-normal font-bold">
      Mental Health<br>Check-In
    </span>
  </div>

  <!-- Navigation -->
  <nav class="flex flex-col gap-1.5 px-3.5 py-6">
    <a href="{% url 'home' %}"
       class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'home' %}bg-active{% endif %}">
      <img src="{% static 'icons/home.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Home</span>
    </a>

    <a href="#"
       class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'check_in' %}bg-active{% endif %}">
      <img src="{% static 'icons/check_in.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Check In</span>
    </a>

    <a href="#"
       class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'appointments' %}bg-active{% endif %}">
      <img src="{% static 'icons/appointment.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Appointments</span>
    </a>

    <a href="#"
       class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'resources' %}bg-active{% endif %}">
      <img src="{% static 'icons/resources.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Resources</span>
    </a>

    <a href="#"
       class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10 {% if current == 'profile' %}bg-active{% endif %}">
      <img src="{% static 'icons/profile.svg' %}" alt="" class="h-6 w-6 shrink-0"><span>Profile</span>
    </a>
  </nav>

  <!-- Log out -->
  <div class="px-3.5 pb-7" style="margin-top:auto">
    <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-lg transition hover:bg-navy/10">
      <img src="{% static 'icons/logoutbutton.svg' %}" alt="" class="w-6 h-6">
      <span>Log Out</span>
    </a>
  </div>

</aside>
{% endwith %}

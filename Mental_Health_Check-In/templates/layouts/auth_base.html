{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Serenify{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="min-h-screen overflow-x-hidden bg-white">
  <main class="grid min-h-screen grid-cols-1 md:grid-cols-2">

    <section
      class="relative flex min-h-[48svh] flex-col items-center justify-center overflow-hidden px-6 pb-20 pt-8 text-center text-white md:min-h-0 md:px-8 md:py-12">

      <div class="login-bg absolute inset-0 scale-125 bg-cover bg-center"></div>

      <div class="absolute inset-0 bg-navy/40"></div>

      <div class="absolute inset-x-0 bottom-0 h-40 bg-linear-to-t from-white from-8% via-white/70 to-transparent md:hidden"></div>

      <div class="relative z-10 flex flex-col items-center">

        <div class="flex h-28 w-28 items-center justify-center rounded-full bg-white shadow-lg md:h-64 md:w-64">
          <img src="{% static 'images/logo.png' %}" alt="Logo" class="h-4/5 w-4/5 object-contain">
        </div>

        <h1 class="mt-4 font-serif text-2xl font-bold uppercase tracking-wide drop-shadow-md md:mt-10 md:text-4xl">
          Serenify
        </h1>
        <p class="mt-1 max-w-[20rem] font-serif text-lg drop-shadow-md md:mt-4 md:text-3xl">Your mind matters.</p>

        <p class="mt-4 max-w-[16rem] font-serif text-sm italic leading-snug drop-shadow-md md:mt-6 md:text-lg">
          Check in. Get support. Take the next step.
        </p>
      </div>
    </section>

    <section class="relative z-10 -mt-px flex items-center justify-center bg-white px-6 pb-8 pt-0 md:mt-0 md:bg-transparent md:p-10">
      <div class="w-full max-w-[345px]">
        {% block auth_content %}{% endblock %}
      </div>
    </section>

  </main>
</body>
</h

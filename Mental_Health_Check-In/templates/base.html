{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Serenify{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-neutral-100 font-sans text-ink">
  <div class="flex min-h-screen">
    {% include "components/layout/sidebar/sidebar.html" %}

    <main class="relative z-10 flex-1 px-12 py-10">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block extra_js %}{% endblock %}
</body>
</html>

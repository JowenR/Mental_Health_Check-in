{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Serenify{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-neutral-100 font-sans text-ink">
  <div class="flex min-h-screen">
    {% include "components/layout/sidebar/sidebar.html" %}

    <main class="relative z-10 min-w-0 flex-1 px-4 pb-8 pt-16 md:px-12 md:py-10">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
